name: Publish browser client

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure production server
        env:
          BLOOM_SERVER_URL: ${{ vars.BLOOM_SERVER_URL }}
        run: |
          test -n "$BLOOM_SERVER_URL"
          printf "window.BLOOM_SERVER_URL = '%s';\n" "$BLOOM_SERVER_URL" > public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
